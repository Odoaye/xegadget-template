<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">XE Tech — Premium Gadgets</title>
  <desc id="desc">A modern preview image for XE Tech featuring sleek branding and gadget visuals.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070707" />
      <stop offset="100%" stop-color="#141414" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7c921" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect x="60" y="60" width="1080" height="510" rx="42" fill="#111" opacity="0.92" filter="url(#shadow)" />
  <rect x="92" y="90" width="520" height="168" rx="26" fill="url(#accent)" opacity="0.95" />
  <text x="112" y="160" font-family="Inter, sans-serif" font-size="60" font-weight="800" fill="#ffffff">XE Tech</text>
  <text x="112" y="220" font-family="Inter, sans-serif" font-size="30" fill="#e5e7eb">Premium gadgets, honest pricing, fast delivery.</text>
  <rect x="720" y="110" width="340" height="220" rx="24" fill="#161616" stroke="#2c2c2c" stroke-width="2" />
  <rect x="730" y="120" width="120" height="120" rx="20" fill="#0f172a" />
  <rect x="874" y="120" width="120" height="120" rx="20" fill="#1e293b" />
  <rect x="728" y="248" width="266" height="70" rx="20" fill="#0f172a" />
  <text x="760" y="175" font-family="Inter, sans-serif" font-size="36" font-weight="700" fill="#f7c921">Smartphone</text>
  <text x="760" y="215" font-family="Inter, sans-serif" font-size="22" fill="#94a3b8">Earbuds, laptops, and more</text>
  <text x="760" y="295" font-family="Inter, sans-serif" font-size="24" fill="#cbd5e1">Authentic tech for modern shoppers.</text>
  <circle cx="180" cy="420" r="88" fill="url(#accent)" opacity="0.9" />
  <circle cx="280" cy="460" r="40" fill="#111" />
  <circle cx="360" cy="420" r="28" fill="#f7c921" />
  <rect x="520" y="390" width="520" height="160" rx="30" fill="#111827" opacity="0.9" />
  <text x="560" y="440" font-family="Inter, sans-serif" font-size="28" fill="#e2e8f0">XE Tech</text>
  <text x="560" y="484" font-family="Inter, sans-serif" font-size="22" fill="#94a3b8">Designed for premium gadget discovery.</text>
</svg>
